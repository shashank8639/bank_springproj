spring.application.name=bank_springproj
spring.datasource.url=jdbc:h2:mem:bankdb;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:create_schema.sql
spring.sql.init.data-locations=classpath:seed_data.sql

spring.h2.console.enabled=true

